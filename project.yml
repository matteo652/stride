name: Stride
options:
  bundleIdPrefix: com.matteo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  Stride:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matteo.stride
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Stride
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Stride uses your location to record your route, distance and pace while you run.
        NSLocationAlwaysAndWhenInUseUsageDescription: Background location lets Stride keep recording your run while the screen is locked or you are in another app.
        NSMotionUsageDescription: Motion data is used to measure your running cadence (steps per minute).
        UIBackgroundModes:
          - location
        ITSAppUsesNonExemptEncryption: false

schemes:
  Stride:
    build:
      targets:
        Stride: all
    archive:
      config: Release
